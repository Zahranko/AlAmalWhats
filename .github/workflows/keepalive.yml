name: Keep API awake

# The shared IIS host stops the app after ~20 idle minutes, which also stops the send queue and
# scheduled campaigns. A request every 10 minutes keeps it running (and starts it again if it
# stopped). GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf --retry 3 --max-time 60 https://whatsappapi.alamalhospitaljo.com/api/health
