name: Deploy frontend

# Hostinger deploys the Next.js app from the `deploy/frontend` branch (root directory `frontend`).
# This workflow moves that branch to main's commit only after lint and build pass, so a broken
# frontend never reaches Hostinger. Hostinger then runs `npm install`, `npm run build`, `npm start`.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Lint and build
        working-directory: frontend
        run: npm ci && npm run lint && npm run build
      - name: Move the deploy/frontend branch to this commit
        run: git push --force origin HEAD:refs/heads/deploy/frontend
