name: Deploy API to VPS

# Builds the API image (backend/Dockerfile), pushes it to GitHub's container registry
# (ghcr.io/zahranko/alamalwhats-api) and deploys that exact digest to the Hostinger VPS with
# the same blue/green switch as the other apps there (nginny-deploy): the new container must
# answer /api/health/ready (database included, migrations applied) before nginx sends it any
# traffic; if it doesn't, the running version keeps serving and this job fails.
#
# Pushes deploy only once the repository variable VPS_DEPLOY is "true" (set it at cutover);
# before that they only build the image. Run it by hand (Actions > Run workflow) to deploy anyway.
#
# Secret: VPS_DEPLOY_KEY (the whatsapp_github_deploy private key; on the VPS it can only run
# "deploy/rollback/status whatsapp-api"). The app's own secrets stay on the server in
# /opt/apps/whatsapp-api/app.env; this job sends none.
# Rollback: ssh -i ~/.ssh/whatsapp_github_deploy deployer@187.126.1.126 "rollback whatsapp-api"
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-vps.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zahranko/alamalwhats-api
  APP: whatsapp-api
  API_URL: https://whatsappapi.alamalhospitaljo.com
  VPS_HOST: 187.126.1.126
  # pinned VPS host key: the job refuses to talk to anything else
  VPS_HOST_KEY: "187.126.1.126 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJoeQxthadBslL2dG3FgwusrozZY89fb1BsJCcK5UMF7"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # The deploy key can only run the forced command on the VPS
      # ("deploy <app> <image@digest>"): no shell, no forwarding.
      # A short-lived registry token goes over stdin, never on the command line or in the log.
      - name: Deploy (blue/green) over SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Secret VPS_DEPLOY_KEY is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          # tolerate a secret pasted from Windows (CRLF line endings)
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key \
            || { echo "::error::VPS_DEPLOY_KEY is not a valid private key: paste the whole whatsapp_github_deploy file (not the .pub)"; exit 1; }
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          {
            printf 'GHCR_USER=%s\n' "${{ github.actor }}"
            printf 'GHCR_TOKEN=%s\n' "$GHCR_TOKEN"
          } | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
                deployer@"$VPS_HOST" "deploy $APP ${IMAGE}@${DIGEST}"

      - name: Check the public endpoint
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/health/ready" || true)
            echo "attempt $i: $code"; [ "$code" = 200 ] && exit 0; sleep 5
          done
          echo "::error::$API_URL/api/health/ready is not 200"; exit 1

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
