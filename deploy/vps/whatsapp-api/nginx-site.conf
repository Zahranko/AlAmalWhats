# /etc/nginx/sites-available/whatsapp-api : WhatsApp platform API (Docker, blue/green behind upstream "whatsapp_api")
# upstream: /etc/nginx/conf.d/whatsapp-api-upstream.conf (rewritten by nginny-deploy on every release)
# Callers: the Next.js frontend (Hostinger), Meta's webhook (/api/webhooks/whatsapp), other
# hospital systems (/api/v1 with X-Api-Key), template buttons (/chat), Meta's /privacy and /terms.
server {
    listen 80;
    listen [::]:80;
    server_name whatsappapi.alamalhospitaljo.com;
    include snippets/nginny-acme.conf;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whatsappapi.alamalhospitaljo.com;
    ssl_certificate     /etc/letsencrypt/live/whatsappapi.alamalhospitaljo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsappapi.alamalhospitaljo.com/privkey.pem;
    include snippets/nginny-https.conf;

    access_log /var/log/nginx/whatsapp-api.access.log;
    error_log  /var/log/nginx/whatsapp-api.error.log;

    # media uploads go up to 105 MB (MediaController); the API enforces each endpoint's own limit
    client_max_body_size 110m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://whatsapp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx states the client IP itself (never appends what the client sent); the app trusts
        # one hop (ASPNETCORE_FORWARDEDHEADERS_ENABLED in the image). X-Wa-Proxy-Secret and
        # X-Wa-Client-Ip from the Next.js server pass through untouched.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
