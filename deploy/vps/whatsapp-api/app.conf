# /opt/apps/whatsapp-api/app.conf : read by nginny-deploy (root-owned, no secrets here)
# WhatsApp platform API (repo AlAmalWhats). The Next.js frontend stays on Hostinger shared hosting.
IMAGE_REPO=ghcr.io/zahranko/alamalwhats-api
DOMAIN=whatsappapi.alamalhospitaljo.com
PORT_BLUE=5131
PORT_GREEN=5132
# database included
HEALTH=/api/health/ready
# Send queue + webhooks for one hospital; uploads up to ~105 MB pass through memory.
MEMORY=768m
CPUS=1
# Docker network shared with SQL Server (reach it as "mssql,1433")
NETWORK=nginny-db
# Secrets are kept on the server in /opt/apps/whatsapp-api/app.env (written by hand, 600).
# The pipeline sends none, so nginny-deploy keeps that file as it is.
ENV_KEYS="ConnectionStrings__Default Proxy__Secret Auth__JwtKey WhatsApp__AccessToken WhatsApp__AppSecret WhatsApp__VerifyToken WhatsApp__PhoneNumberId WhatsApp__BusinessAccountId"
# No PROXY_SECRET_ENV: this app checks its own X-Wa-Proxy-Secret header (from the Next.js server),
# so nginx doesn't need the secret; the site config sets the forwarded headers itself.
